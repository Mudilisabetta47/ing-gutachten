<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-label="Technische Seitenansicht eines Fahrzeugs">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a323b" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0d1116" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ba8ff" stop-opacity="0"/>
      <stop offset=".28" stop-color="#6ba8ff" stop-opacity=".95"/>
      <stop offset=".62" stop-color="#bcd9ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#5ac8e8" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="lampF" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#eef5ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6ba8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bodenschatten -->
  <ellipse cx="620" cy="514" rx="480" ry="30" fill="url(#ground)"/>

  <!-- Karosserie -->
  <path d="M96 372 C96 340 112 320 148 312 L252 288 C296 226 366 190 470 182 L742 176
           C842 178 906 208 956 262 L1092 292 C1136 302 1160 322 1160 354 L1160 396
           C1160 408 1150 416 1136 416 L120 416 C104 416 96 406 96 394 Z"
        fill="url(#bodyG)" stroke="url(#rim)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Glasflaeche -->
  <path d="M320 282 C356 234 414 208 486 202 L720 197 C796 200 848 224 890 268 Z"
        fill="#0a0f14" fill-opacity=".85" stroke="#5ac8e8" stroke-opacity=".35" stroke-width="1.4"/>
  <path d="M600 200 L600 282" stroke="#5ac8e8" stroke-opacity=".25" stroke-width="1.4"/>

  <!-- Charakterlinien -->
  <path d="M170 330 L1120 330" stroke="#ffffff" stroke-opacity=".07" stroke-width="1.2"/>
  <path d="M262 356 C480 348 800 346 1082 356" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.4"/>
  <path d="M600 288 L600 416" stroke="#ffffff" stroke-opacity=".07" stroke-width="1.2"/>

  <!-- Radhaeuser -->
  <path d="M232 416 A118 118 0 0 1 468 416 Z" fill="#07090c"/>
  <path d="M812 416 A118 118 0 0 1 1048 416 Z" fill="#07090c"/>

  <!-- Raeder -->
  <g stroke="url(#rim)" stroke-width="2" fill="#0a0d11">
    <circle cx="350" cy="416" r="96"/>
    <circle cx="930" cy="416" r="96"/>
  </g>
  <g fill="none" stroke="#5ac8e8" stroke-opacity=".35" stroke-width="1.2">
    <circle cx="350" cy="416" r="58"/><circle cx="930" cy="416" r="58"/>
    <circle cx="350" cy="416" r="18"/><circle cx="930" cy="416" r="18"/>
  </g>
  <g stroke="#ffffff" stroke-opacity=".14" stroke-width="1">
    <path d="M350 358 L350 474 M292 416 L408 416 M309 375 L391 457 M309 457 L391 375"/>
    <path d="M930 358 L930 474 M872 416 L988 416 M889 375 L971 457 M889 457 L971 375"/>
  </g>

  <!-- Licht -->
  <ellipse cx="140" cy="336" rx="120" ry="52" fill="url(#lampF)" opacity=".55"/>
  <rect x="104" y="326" width="62" height="14" rx="7" fill="#dbe9ff" opacity=".9"/>
  <rect x="1104" y="322" width="48" height="12" rx="6" fill="#6ba8ff" opacity=".55"/>

  <!-- Messmarken -->
  <g stroke="#5ac8e8" stroke-opacity=".45" stroke-width="1" fill="none">
    <path d="M96 548 L96 566 M1160 548 L1160 566 M96 557 L1160 557"/>
    <path d="M350 584 L350 600 M930 584 L930 600 M350 592 L930 592"/>
  </g>
  <g fill="#5ac8e8" fill-opacity=".6" font-family="monospace" font-size="15" letter-spacing="2">
    <text x="600" y="551" text-anchor="middle">GESAMTLÄNGE</text>
    <text x="640" y="586" text-anchor="middle">RADSTAND</text>
  </g>
</svg>
